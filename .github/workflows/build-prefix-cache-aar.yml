name: Build prefix-cache Android AAR

on:
  workflow_dispatch:
    inputs:
      reuse_aar_run_id:
        description: "Optional successful run ID whose JNI libraries should be reused"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_NDK_HOME: /opt/android-ndk
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs unzip zip
          sudo npm install -g @bazel/bazelisk

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/android-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;28.1.13356709"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.1.13356709" >> "$GITHUB_ENV"

      - name: Test checkpoint implementation
        if: inputs.reuse_aar_run_id == ''
        run: |
          set -euo pipefail
          bazelisk test --test_output=errors \
            //runtime/conversation:conversation_test

      - name: Build and verify patched Kotlin classes
        run: |
          set -euo pipefail
          target_kotlin=//kotlin/java/com/google/ai/edge/litertlm:litertlm-jvm-classes
          common=(--deleted_packages=swift)
          bazelisk build "${common[@]}" "$target_kotlin"

          mapfile -t kotlin_candidates < <(
            {
              bazelisk cquery "${common[@]}" \
                --output=files "$target_kotlin" || true
              find -L bazel-bin/kotlin/java/com/google/ai/edge/litertlm \
                -type f -name '*.jar'
            } | sort -u
          )
          kotlin_jar=""
          for candidate in "${kotlin_candidates[@]}"; do
            if unzip -Z1 "$candidate" | \
              grep -E '(^|/)Conversation\.class$' >/dev/null; then
              kotlin_jar="$candidate"
              break
            fi
          done
          if [[ -z "$kotlin_jar" ]]; then
            printf 'No Kotlin classes JAR found. Candidates:\n%s\n' \
              "${kotlin_candidates[*]}" >&2
            exit 1
          fi
          conversation_class=$(unzip -Z1 "$kotlin_jar" | \
            grep -E '(^|/)Conversation\.class$' | sed -n '1p')
          unzip -p "$kotlin_jar" "$conversation_class" | strings | \
            grep -x 'resetToPreface' >/dev/null
          cp "$kotlin_jar" /tmp/litertlm-android.jar
          echo "Using Kotlin classes JAR: $kotlin_jar"

      - name: Build patched JNI libraries
        if: inputs.reuse_aar_run_id == ''
        run: |
          set -euo pipefail
          target_jni=//kotlin/java/com/google/ai/edge/litertlm/jni:litertlm_jni
          common=(--deleted_packages=swift)

          bazelisk build --config=android_arm64 "${common[@]}" "$target_jni"
          mkdir -p /tmp/prefix-aar/jni/arm64-v8a
          arm64_so=$(bazelisk cquery --config=android_arm64 "${common[@]}" \
            --output=files "$target_jni" | grep -E 'liblitertlm_jni\.so$' | head -n1)
          cp "$arm64_so" /tmp/prefix-aar/jni/arm64-v8a/liblitertlm_jni.so

          bazelisk build --config=android_x86_64 "${common[@]}" "$target_jni"
          mkdir -p /tmp/prefix-aar/jni/x86_64
          x64_so=$(bazelisk cquery --config=android_x86_64 "${common[@]}" \
            --output=files "$target_jni" | grep -E 'liblitertlm_jni\.so$' | head -n1)
          cp "$x64_so" /tmp/prefix-aar/jni/x86_64/liblitertlm_jni.so

      - name: Assemble AAR
        env:
          REUSE_AAR_RUN_ID: ${{ inputs.reuse_aar_run_id }}
        run: |
          set -euo pipefail
          if [[ -n "$REUSE_AAR_RUN_ID" ]]; then
            mkdir -p /tmp/reused-aar
            gh run download "$REUSE_AAR_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name litertlm-android-prefix-cache \
              --dir /tmp/reused-aar
            cp /tmp/reused-aar/litertlm-android-prefix-cache.aar /tmp/base.aar
          else
            curl -fsSL -o /tmp/base.aar \
              https://dl.google.com/dl/android/maven2/com/google/ai/edge/litertlm/litertlm-android/0.16.1/litertlm-android-0.16.1.aar
          fi
          mkdir -p /tmp/base-aar
          unzip -q /tmp/base.aar -d /tmp/base-aar
          cp /tmp/litertlm-android.jar /tmp/base-aar/classes.jar
          if [[ -z "$REUSE_AAR_RUN_ID" ]]; then
            cp -R /tmp/prefix-aar/jni/. /tmp/base-aar/jni/
          fi
          unzip -Z1 /tmp/base-aar/classes.jar | \
            grep -E '(^|/)Conversation\.class$' >/dev/null
          mkdir -p dist
          (cd /tmp/base-aar && zip -qr "$GITHUB_WORKSPACE/dist/litertlm-android-prefix-cache.aar" .)

      - uses: actions/upload-artifact@v4
        with:
          name: litertlm-android-prefix-cache
          path: dist/litertlm-android-prefix-cache.aar
          if-no-files-found: error

      - name: Check out Flutter plugin
        uses: actions/checkout@v4
        with:
          repository: wachinaba/litertlm
          ref: prefix-cache-checkpoint
          path: flutter-plugin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compile Flutter example against patched AAR
        run: |
          set -euo pipefail
          mkdir -p flutter-plugin/android/libs
          cp dist/litertlm-android-prefix-cache.aar \
            flutter-plugin/android/libs/litertlm-android-prefix-cache.aar
          cd flutter-plugin
          flutter pub get
          mkdir -p example/assets/audio example/assets/images example/assets/models
          flutter create --platforms=android \
            --project-name=litertlm_example \
            --org=org.rockstudio example
          cd example
          flutter build apk --debug
